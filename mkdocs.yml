site_name: TJM – The Journey Matters
site_description: Documentation for the TJM Fabric mod
repo_url: https://github.com/JannisHeydemann/TJM
docs_dir: docs
theme:
  name: material
  features:
    - search.suggest
    - search.highlight
    - navigation.instant
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
plugins:
  - search
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
nav:
  - Home: index.md
  - Game Mechanics: Game-Mechanics.md
  - Code Documentation: Code-Documentation.md
  - Contributing: Contributing.md
