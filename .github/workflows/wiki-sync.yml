name: Wiki sync

on:
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'
      - '.github/workflows/wiki-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish docs/wiki to the GitHub Wiki
        env:
          TOKEN: ${{ secrets.WIKI_SYNC_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${REPO}.wiki.git" /tmp/wiki
          rsync -a --delete --exclude='.git' docs/wiki/ /tmp/wiki/
          cd /tmp/wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Sync wiki from ${GITHUB_SHA}"
          git push
